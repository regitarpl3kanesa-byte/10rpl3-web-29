<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Microsite - Sosial Media</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Foto Profil -->
        <div class="profile">
            <img src="foto.jpg" alt="Foto Profil">
        </div>

        <!-- Nama -->
        <h1>Nama Kamu</h1>

        <!-- Username -->
        <p class="username">@usernamekamu</p>

        <!-- Deskripsi -->
        <p class="description">
            Welcome to my microsite 💕
            <br>
            Temukan saya di sosial media berikut.
        </p>

        <!-- Sosial Media -->
        <div class="social-media">

            <a href="https://instagram.com/" target="_blank" class="social">
                <span>📷</span>
                <p>Instagram</p>
                <b>›</b>
            </a>

            <a href="https://www.tiktok.com/" target="_blank" class="social">
                <span>🎵</span>
                <p>TikTok</p>
                <b>›</b>
            </a>

            <a href="https://wa.me/628123456789" target="_blank" class="social">
                <span>💬</span>
                <p>WhatsApp</p>
                <b>›</b>
            </a>

            <a href="https://facebook.com/" target="_blank" class="social">
                <span>💙</span>
                <p>Facebook</p>
                <b>›</b>
            </a>

            <a href="https://youtube.com/" target="_blank" class="social">
                <span>▶️</span>
                <p>YouTube</p>
                <b>›</b>
            </a>

        </div>

        <!-- Footer -->
        <footer>
            Made with ♡
        </footer>

    </div>

</body>
</html>
