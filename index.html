    <!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Media</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Kartu utama -->
    <div class="card">

        <!-- Bagian atas -->
        <div class="header">

            <!-- Foto -->
            <img src="foto-saya.jpg" alt="Foto Saya" class="foto">

            <!-- Nama -->
            <h1>Nama Kamu</h1>

            <p>@username</p>

        </div>


        <!-- Isi -->
        <div class="content">

            <p class="bio">
                Selamat datang di sosial media saya 💕
            </p>


            <!-- Instagram -->
            <a href="https://www.instagram.com/" class="button">
                📷 Instagram
            </a>


            <!-- TikTok -->
            <a href="https://www.tiktok.com/" class="button">
                🎵 TikTok
            </a>


            <!-- WhatsApp -->
            <a href="https://wa.me/628123456789" class="button">
                💬 WhatsApp
            </a>


            <!-- Facebook -->
            <a href="https://www.facebook.com/" class="button">
                💙 Facebook
            </a>


            <!-- GitHub -->
            <a href="https://github.com/" class="button">
                💻 GitHub
            </a>


            <!-- Logo kecil -->
            <div class="logo">
                ♡
            </div>

        </div>

    </div>

</body>
</html>
</body>
</html>
